<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TVING Tech Meetup — Vol. 07</title>
<meta name="description" content="No.1 K-콘텐츠 플랫폼을 만드는 기술과 사람들의 이야기. TVING Tech Meetup, 한 달에 한 번." />

<!-- Tailwind (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "tving-red": "#FF153C",
          "bg-0": "#000000",
          "bg-1": "#0a0a0a",
          "bg-2": "#121212",
          "bg-3": "#1a1a1a",
          "fg-1": "#ffffff",
          "fg-2": "#e5e5e5",
          "fg-3": "#a0a0a0",
          "fg-4": "#6a6a6a",
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', "Pretendard", "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>

<!-- Styles -->
<link rel="stylesheet" href="styles.css" />

<!-- Form input baseline (kept here so it ships in one paint) -->
<style>
  .field-wrap input,
  .field-wrap textarea {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--fg-1);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 200ms ease-out, box-shadow 200ms ease-out, background 200ms ease-out;
    outline: none;
    resize: vertical;
  }
  .field-wrap input::placeholder,
  .field-wrap textarea::placeholder { color: var(--fg-4); }
  .field-wrap input:hover,
  .field-wrap textarea:hover { border-color: var(--line-strong); }
  .field-wrap input:focus,
  .field-wrap textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(255,21,60,0.12);
    background: var(--bg-1);
  }

  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* avoid Tailwind preflight nuking */
  body { background: var(--bg-0) !important; color: var(--fg-1) !important; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Order matters: data → hooks → icons → components → app -->
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="hooks.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="components/HeaderHero.jsx"></script>
  <script type="text/babel" src="components/About.jsx"></script>
  <script type="text/babel" src="components/Schedule.jsx"></script>
  <script type="text/babel" src="components/Speakers.jsx"></script>
  <script type="text/babel" src="components/CFP.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TVING Tech Meetup — Hero Variations</title>

<!-- Pretendard + display fonts -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  body { margin: 0; background: #f0eee9; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="variations/v1-editorial.jsx"></script>
  <script type="text/babel" src="variations/v2-broadcast.jsx"></script>
  <script type="text/babel" src="variations/v3-brutalist.jsx"></script>
  <script type="text/babel" src="variations/v4-posterwall.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="originals"
            title="TVING Tech Meetup — Hero Directions"
            subtitle="현재 시안(다크+레드) 외 4가지 비주얼 방향. 카드 헤더의 ⌬ 버튼으로 풀스크린."
          >
            <DCArtboard id="current" label="00 · 현재 시안 (Dark + Red)" width={1440} height={900}>
              <iframe
                src="index.html"
                style={{ width: 1440, height: 900, border: "none", display: "block", background: "#000" }}
                title="current"
              />
            </DCArtboard>

            <DCArtboard id="v1" label="01 · Editorial Paper" width={1440} height={900}>
              <V1Editorial />
            </DCArtboard>

            <DCArtboard id="v2" label="02 · Broadcast Signal" width={1440} height={900}>
              <V2Broadcast />
            </DCArtboard>

            <DCArtboard id="v3" label="03 · Brutalist Mono" width={1440} height={900}>
              <V3Brutalist />
            </DCArtboard>

            <DCArtboard id="v4" label="04 · Poster Wall (Cinematic)" width={1440} height={900}>
              <V4PosterWall />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
